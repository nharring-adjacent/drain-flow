[package]
name = "drain-flow"
version = "0.6.0"
edition = "2021"
rust-version="1.78.0"
license-file="LICENSE"
description = "Utility for parsing and analyzing log files of arbitrary format based on the DRAIN algorithm"

[dependencies]
anyhow = "1.0.63"
arc-string-interner = "0.3.0-alpha2"
chrono = "0.4.22"
custom_derive = "0.1.7"
derive_more = { version="2.0.0", features=["full"]}
enum_derive = "0.1.7"
float_eq = "1.0.0"
fraction = "0.15.1"
itertools = "0.14.0"
lazy_static = "1.4.0"
joinery = "3.0.0"
parking_lot = { version = "0.12.1", features = [
    "hardware-lock-elision",
    "send_guard",
] }
regex = "1.6.0"
spectral = "0.6.0"
uuid = { version = "1.0", features = ["v4", "v1", "serde" ] }
string-interner = { version = "0.19.0" }
tracing = "0.1.36"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0.85"
differential-dataflow = "0.12"
timely = "0.12"
lasso = "0.7.1"
interned-string = "0.3.0"
intern_string = "0.2.0"

[dev-dependencies]
chrono = "0.4"
criterion = {version = "0.5.1", features = ["html_reports"]}
proptest = "1.0.0"
rand = "0.9.0" # Reverted to original version
serde = "1.0.144"
regex = "1" # Version specified in prompt
lazy_static = "1.4" # Version specified in prompt
serde_derive = "1.0.144"
tracing-test = "0.2.3"
tinytemplate = "1.2.1"

[[bench]]
name = "core_benchmarks"
harness = false


[[bench]]
name = "sink_benchmark"
harness = false

[[bench]]
name = "two_stage_drain_integration_test"
harness = false

[[bench]]
name = "drain_benchmarks"
harness = false

[[bench]]
name = "query_benchmarks"
harness = false

[[bench]]
name = "string_interning_benchmark"
harness = false

[features]
intern_benchmark_harness = []
verbose-tests = []
